seguridade e checklists',text:'Rotinas de entrada, higienização, vacinação, inspeção e ocorrências podem ser convertidas em checklists auditáveis. Cada tarefa passa a ter responsável, horário e status, criando histórico para gestão e prevenção.',bullets:['Checklists por turno','Pendências e responsáveis','Registro de ocorrências'],screen:{title:'AVI360 • Biosseguridade',kpis:[['92%','Checklist concluído'],['3','Pendências'],['0','Ocorrências críticas']],after:['100%','0']}},{title:'Consumo, ração e água',text:'A plataforma demonstra como acompanhar consumo e identificar desvios que podem antecipar problemas de comportamento, ambiente ou operação. O foco é transformar uma sequência de números em tendência visual e acionável.',bullets:['Consumo diário e acumulado','Detecção de desvios','Comparação entre galpões'],screen:{title:'AVI360 • Consumo',kpis:[['4,8 t','Ração acumulada'],['7,2 m³','Água hoje'],['+2,1%','Variação']],after:['4,9 t','7,4 m³']}},{title:'Central de alertas e relatórios',text:'A camada final organiza eventos por prioridade e gera um histórico útil para reunião de equipe, acompanhamento de desempenho e auditoria interna. Em produção, os alertas podem ser encaminhados por push, e-mail ou mensageria.',bullets:['Alertas por criticidade','Histórico de resolução','Exportação de relatórios'],screen:{title:'AVI360 • Central de alertas',kpis:[['1','Crítico'],['4','Atenções'],['17','Resolvidos']],after:['0','3']}}],faq:[['Precisa de sensores físicos?','Não necessariamente. O sistema pode começar com entrada manual e evoluir para sensores conforme viabilidade técnica.'],['Funciona no celular?','Sim. A experiência foi desenhada com prioridade para uso em campo e telas menores.'],['Pode atender várias granjas?','Sim. A arquitetura conceitual prevê organizações, unidades, galpões e lotes independentes.'],['Os dados desta página são reais?','Não. Tudo exibido aqui é fictício e existe apenas para demonstração pública.']]}))</script></body></html>
