<!doctype html><html class='module'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><link rel='stylesheet' href='../../../assets/product-demo.css'><body><div class='demo'><div class='demohead'><small>AVI360</small><h1>Checklist de biosseguridade</h1></div><div class='card'><p>Progresso</p><div class='bar'><i id='p' style='width:0%'></i></div><label class='row'><b>Pedilúvio conferido</b><input type='checkbox' onchange='u()'></label><label class='row'><b>Controle de acesso</b><input type='checkbox' onchange='u()'></label><label class='row'><b>EPI verificado</b><input type='checkbox' onchange='u()'></label><label class='row'><b>Higienização concluída</b><input type='checkbox' onchange='u()'></label><p id='m' class='muted'>0/4 itens concluídos.</p></div></div><script>function u(){let n=[...document.querySelectorAll('input')].filter(x=>x.checked).length;p.style.width=(n*25)+'%';m.textContent=n+'/4 itens concluídos nesta demonstração.'}</script></body></html>
