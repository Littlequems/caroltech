<!doctype html><html class='module'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><link rel='stylesheet' href='../../../assets/product-demo.css'><body><div class='demo'><div class='demohead'><small>ELETRIPRO</small><h1>Cálculo demonstrativo</h1></div><div class='card'><label>Base fictícia R$ <input id='b' type='number' value='4500'></label><label>Complexidade <select id='c'><option value='1'>Padrão</option><option value='1.25'>Elevada</option><option value='1.5'>Especial</option></select></label><p><button onclick="v.textContent=(+b.value*+c.value).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})">Calcular</button></p><h2 id='v'>R$ 4.500,00</h2><p class='muted'>Valores fictícios, sem caráter de tabela oficial.</p></div></div></body></html>
