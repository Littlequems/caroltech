<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#eef2f4;color:#18303d;font-family:Inter,system-ui,Arial}.app{max-width:850px;margin:auto;padding:18px}.top{background:#103247;color:white;border-radius:18px;padding:20px}.card{background:white;border:1px solid #dce4e8;border-radius:15px;padding:16px;margin-top:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}select,input{width:100%;padding:10px;border:1px solid #d6e0e4;border-radius:9px}.btn{border:0;border-radius:10px;padding:11px 14px;background:#d0a64f;color:#132736;font-weight:900}.value{font-size:32px;font-weight:900;color:#0c7558}.muted{color:#73858f;font-size:12px}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><div class="app"><div class="top"><small>ELETRIPRO • DEMO</small><h1>Assistente de orçamento técnico</h1></div><div class="card"><div class="row"><label>Categoria<select id="cat"><option>Projeto de instalações</option><option>Consultoria especializada</option><option>Laudo técnico</option></select></label><label>Complexidade<select id="cx"><option value="1">Padrão</option><option value="1.25">Elevada</option><option value="1.5">Especial</option></select></label><label>Referência base (R$)<input id="base" type="number" value="4500"></label><label>Repetição / ajuste<select id="rep"><option value="1">Sem repetição</option><option value=".85">Com reaproveitamento</option></select></label></div><p><button class="btn" onclick="calc()">Calcular referência demonstrativa</button></p></div><div class="card"><small class="muted">REFERÊNCIA CALCULADA</small><div class="value" id="val">R$ 4.500,00</div><p class="muted">Demonstração conceitual. Uma proposta profissional exige escopo, responsabilidade técnica, despesas, tributos e condições específicas.</p></div></div><script>function calc(){let v=+base.value*+cx.value*+rep.value;val.textContent=v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}</script></body></html>
