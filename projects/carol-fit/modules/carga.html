<!doctype html><html class='module'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><link rel='stylesheet' href='../../../assets/product-demo.css'><body><div class='demo'><div class='demohead'><small>CAROL FIT</small><h1>Calibrar carga</h1></div><div class='card'><label>Carga fictícia <input id='c' type='range' min='5' max='100' value='40' oninput="v.textContent=this.value+' kg'"></label><h2 id='v'>40 kg</h2><select id='e'><option>Fácil</option><option selected>Adequado</option><option>Difícil</option></select><p><button onclick="r.textContent=e.value==='Fácil'?'Sugestão demo: +5%':e.value==='Difícil'?'Sugestão demo: -5%':'Sugestão demo: manter'">Calcular sugestão</button></p><b id='r'>Sugestão demo: manter</b></div></div></body></html>
